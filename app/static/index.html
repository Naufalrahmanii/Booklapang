<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookLapang</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  form { display: grid; gap: .5rem; margin-bottom: 1.5rem; }
  input, select, button { padding: .5rem; font-size: 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #000; padding: .4rem; text-align: left; }
  #msg { margin: .5rem 0; font-weight: bold; }
</style>
</head>
<body>
<h1>BookLapang</h1>
<form id="f">
  <input name="name" placeholder="Nama pemesan" required>
  <select name="court">
    <option>Badminton A</option><option>Badminton B</option><option>Futsal 1</option>
  </select>
  <input type="date" name="booking_date" required>
  <input type="number" name="hour" min="8" max="22" placeholder="Jam (8-22)" required>
  <button>Pesan</button>
</form>
<div id="msg"></div>
<table>
  <thead><tr><th>Tanggal</th><th>Jam</th><th>Lapangan</th><th>Pemesan</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
async function load() {
  const res = await fetch('/bookings');
  const data = await res.json();
  const tb = document.getElementById('rows');
  tb.innerHTML = '';
  for (const b of data) {
    const tr = document.createElement('tr');
    for (const v of [b.booking_date, b.hour + ':00', b.court, b.name]) {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const o = Object.fromEntries(new FormData(e.target));
  o.hour = Number(o.hour);
  const res = await fetch('/bookings', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(o)});
  const msg = document.getElementById('msg');
  if (res.status === 201) { msg.textContent = 'Berhasil dipesan.'; load(); }
  else if (res.status === 409) { msg.textContent = 'Slot itu sudah dipesan orang lain.'; }
  else { msg.textContent = 'Input tidak valid (' + res.status + ').'; }
});
load();
</script>
</body>
</html>
